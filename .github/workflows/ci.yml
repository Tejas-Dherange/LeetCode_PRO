name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint code
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      
      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "::notice::📦 Bundle size: $BUNDLE_SIZE"

  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codeloom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
      
      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/codeloom_test
      
      - name: Run tests
        working-directory: backend
        run: npm test || echo "⚠️ No tests configured"
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/codeloom_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret

  # Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for sensitive data
        run: |
          if grep -r "password\|secret\|api_key" --include="*.js" --include="*.jsx" --exclude-dir=node_modules .; then
            echo "::warning::Potential sensitive data found in code"
          fi
      
      - name: Check file sizes
        run: |
          find . -type f -size +10M -not -path "./node_modules/*" -not -path "./.git/*" || true

  # Deploy Backend (only on main branch after tests pass)
  deploy-backend:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            echo "🚀 Starting automated deployment..."
            
            # Navigate to project
            cd ~/LeetCode_PRO/backend
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Save current state for rollback
            echo "� Backing up current deployment..."
            docker tag algopattern-backend:latest algopattern-backend:backup 2>/dev/null || echo "No previous backend image to backup"
            docker tag algopattern-worker:latest algopattern-worker:backup 2>/dev/null || echo "No previous worker image to backup"
            
            # Build and restart containers (migrations run automatically via entrypoint)
            echo "🐳 Rebuilding Docker containers..."
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Health check with retries
            echo "🏥 Performing health check..."
            RETRY_COUNT=0
            MAX_RETRIES=3
            RETRY_DELAY=10
            HEALTH_STATUS=""
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep $RETRY_DELAY
              HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
              
              if [ "$HEALTH_STATUS" = "200" ]; then
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Health check attempt $RETRY_COUNT/$MAX_RETRIES failed (HTTP $HEALTH_STATUS), retrying..."
              fi
            done
            
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Deployment successful! Backend is healthy."
              
              # Clean up old backup images
              echo "🧹 Cleaning up old images..."
              docker image rm algopattern-backend:backup 2>/dev/null || true
              docker image rm algopattern-worker:backup 2>/dev/null || true
              docker image prune -f
              
              docker-compose -f docker-compose.prod.yml ps
              echo "📋 Recent logs:"
              docker-compose -f docker-compose.prod.yml logs --tail=20 backend
            else
              echo "❌ Health check failed after $MAX_RETRIES attempts (HTTP $HEALTH_STATUS)"
              echo "🔄 Performing automatic rollback..."
              
              # Stop failed deployment
              docker-compose -f docker-compose.prod.yml down
              
              # Restore backup images
              echo "♻️ Restoring previous version..."
              docker tag algopattern-backend:backup algopattern-backend:latest 2>/dev/null || echo "⚠️ No backup to restore"
              docker tag algopattern-worker:backup algopattern-worker:latest 2>/dev/null || echo "⚠️ No backup to restore"
              
              # Start old containers
              docker-compose -f docker-compose.prod.yml up -d
              
              sleep 10
              
              # Verify rollback with retries
              echo "🏥 Verifying rollback..."
              ROLLBACK_RETRY=0
              ROLLBACK_STATUS=""
              
              while [ $ROLLBACK_RETRY -lt 3 ]; do
                sleep 5
                ROLLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
                
                if [ "$ROLLBACK_STATUS" = "200" ]; then
                  break
                fi
                
                ROLLBACK_RETRY=$((ROLLBACK_RETRY + 1))
              done
              
              if [ "$ROLLBACK_STATUS" = "200" ]; then
                echo "✅ Rollback successful! Service restored to previous version."
                docker-compose -f docker-compose.prod.yml ps
                
                # Verify database connection
                echo "🔍 Verifying database connection..."
                docker-compose -f docker-compose.prod.yml exec -T backend npx prisma db execute --stdin <<< "SELECT 1" > /dev/null 2>&1 && echo "✅ Database connection verified" || echo "⚠️ Database connection check failed"
              else
                echo "❌ Rollback verification failed! Manual intervention required."
              fi
              
              echo "📋 Failure logs:"
              docker-compose -f docker-compose.prod.yml logs --tail=50 backend
              
              exit 1
            fi
      
      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice::✅ Backend deployed successfully to production"
          else
            echo "::error::❌ Deployment failed - check logs"
          fi


