name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'production'

env:
  DEPLOY_PATH: ~/LeetCode_PRO/backend
  HEALTH_ENDPOINT: http://localhost:3000/health

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ secrets.APP_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            echo "🚀 Starting deployment to ${{ github.event.inputs.environment || 'production' }}..."
            
            # Navigate to project
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy
            
            # Build and restart containers
            echo "� Rebuilding Docker containers..."
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Clean up
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Health check
            echo "🏥 Performing health check..."
            sleep 10
            
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_ENDPOINT }})
            
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Deployment successful! Backend is healthy."
              docker-compose -f docker-compose.prod.yml ps
            else
              echo "❌ Health check failed (HTTP $HEALTH_STATUS)"
              echo "🔄 Rolling back..."
              docker-compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
      
      - name: Deployment Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice::✅ Backend deployed successfully to ${{ github.event.inputs.environment || 'production' }}"
          else
            echo "::error::❌ Deployment failed - check logs above"
          fi


